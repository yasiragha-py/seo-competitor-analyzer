<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Competitor Analyzer</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #14161d;
    --border: #23262f;
    --accent: #4ea8ff;
    --accent-soft: #4ea8ff20;
    --text: #e8e9ec;
    --text-dim: #8b8f9a;
    --good: #34d399;
    --bad: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', Inter, Arial, sans-serif;
    padding: 20px 24px 100px;
  }
  .container { max-width: 960px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 36px; cursor: pointer; width: fit-content; }
  .topbar span { font-weight: 600; font-size: 14px; color: var(--accent); }
  .topbar:hover { opacity: 0.8; }

  .back-to-top {
    display: none; position: fixed; bottom: 24px; right: 24px;
    background: var(--accent); color: #0b0d12; border: none;
    padding: 12px 18px; border-radius: 30px; font-weight: 600; font-size: 13px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.4); z-index: 500;
    align-items: center; gap: 6px;
  }
  .back-to-top:hover { opacity: 0.9; }

  .header { margin-bottom: 28px; text-align: center; }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
  .header p { color: var(--text-dim); font-size: 14px; margin-top: 6px; }

  .input-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; }
  textarea {
    width: 100%; min-height: 90px; background: #0f1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    font-size: 14px; resize: vertical; outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  .suggestions {
    display: none; position: absolute; z-index: 50; background: #14161d;
    border: 1px solid var(--border); border-radius: 8px; margin-top: 4px;
    max-width: calc(100% - 40px); width: 100%; max-height: 180px; overflow-y: auto;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .suggestions .sugg-head {
    padding: 8px 12px; font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .suggestions .sugg-head .clear-history { cursor: pointer; color: var(--accent); text-transform: none; letter-spacing: 0; }
  .suggestions .sugg-item { padding: 9px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .suggestions .sugg-item:last-child { border-bottom: none; }
  .suggestions .sugg-item:hover { background: var(--accent-soft); }

  .input-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .count-badge { font-size: 12px; color: var(--text-dim); }
  .warning { color: var(--warn); font-size: 13px; }

  .action-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  button.primary {
    background: var(--accent); color: #0b0d12; border: none;
    padding: 11px 22px; border-radius: 8px; font-weight: 600; font-size: 14px;
    cursor: pointer; transition: opacity 0.15s;
  }
  button.primary:hover { opacity: 0.88; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  button.secondary {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  button.secondary:hover { color: var(--text); border-color: var(--text-dim); }

  .quota-text { font-size: 12px; color: var(--text-dim); margin-left: auto; }
  .quota-text b { color: var(--accent); }

  #loading { display: none; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; margin-top: 14px; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .site-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-top: 20px; }
  .site-card h3 { color: var(--accent); font-size: 16px; font-weight: 600; margin-bottom: 4px; word-break: break-all; }
  .site-card .title-line { color: var(--text-dim); font-size: 13px; margin-bottom: 16px; }

  .section-label {
    font-size: 11px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.5px; margin: 20px 0 10px; font-weight: 600;
  }
  .section-label:first-of-type { margin-top: 4px; }

  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .metric {
    background: #0f1117; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; transition: background 0.12s, border-color 0.12s;
  }
  .metric.clickable { cursor: pointer; }
  .metric.clickable:hover { background: var(--accent-soft); border-color: var(--accent); }
  .metric .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .metric .value { font-size: 18px; font-weight: 600; }
  .metric .sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
  .metric.clickable .value::after { content: " →"; color: var(--accent); font-weight: 400; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
  .badge.ok { color: var(--good); }
  .badge.no { color: var(--bad); }
  .badge.mid { color: var(--warn); }

  .tag { display: inline-block; background: #0f1117; border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 20px; margin: 0 6px 6px 0; font-size: 12px; }

  .score-bar-wrap { background: #0f1117; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .score-bar-track { background: var(--border); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .score-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .score-checklist { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .score-checklist .item { display: flex; align-items: center; gap: 8px; }

  .card-actions { display: flex; gap: 10px; margin-top: 18px; }
  .download-btn {
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); padding: 8px 16px; border-radius: 6px;
    font-size: 13px; cursor: pointer; transition: background 0.15s;
  }
  .download-btn:hover { background: var(--accent-soft); }
  .copy-btn {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px;
    font-size: 13px; cursor: pointer;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .error-card { border-color: var(--bad); }
  .error-text { color: var(--bad); font-size: 14px; margin-top: 4px; }

  .compare-card { border-color: var(--accent); }
  .compare-card h3 { color: var(--accent); }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 999; backdrop-filter: blur(2px); }
  .modal { background: var(--card); border: 1px solid var(--border); max-width: 720px; margin: 60px auto; padding: 24px 26px; border-radius: 12px; max-height: 74vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { font-size: 15px; color: var(--accent); word-break: break-all; padding-right: 12px; }
  .close-btn { cursor: pointer; color: var(--text-dim); font-size: 13px; flex-shrink: 0; border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; }
  .close-btn:hover { color: var(--text); }
  .modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .modal td { padding: 8px 6px; border-bottom: 1px solid var(--border); word-break: break-all; vertical-align: top; }
  .modal tr:last-child td { border-bottom: none; }
  .modal td.tag-cell { color: var(--text-dim); width: 90px; font-weight: 600; }
  .modal td.no-alt { color: var(--bad); }
  .modal td.status-bad { color: var(--bad); font-weight: 600; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--accent); color: var(--text);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 1001;
    display: none;
  }
</style>
</head>
<body>
<div class="container">

  <div class="topbar" onclick="reloadPage()" title="Reload / New search">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="7" stroke="#4ea8ff" stroke-width="1.8"/>
      <path d="M21 21L16.65 16.65" stroke="#4ea8ff" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8 11L10 13L14.5 8.5" stroke="#4ea8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>SEO Analyzer</span>
  </div>

  <div class="header">
    <h1>SEO Competitor Analyzer</h1>
    <p>One URL per line — compare up to 5 competitors at once</p>
  </div>

  <div class="input-card">
    <textarea id="urls" placeholder="https://example.com&#10;https://competitor.com"></textarea>

    <div class="suggestions" id="suggestions">
      <div class="sugg-head">
        <span>Recently checked</span>
        <span class="clear-history" onclick="clearHistory(event)">Clear</span>
      </div>
      <div id="suggestionsList"></div>
    </div>

    <div class="input-meta">
      <span class="count-badge" id="countBadge">0 / 5 URLs</span>
      <span class="warning" id="warning"></span>
    </div>

    <div class="action-row">
      <button class="primary" onclick="runAnalysis()">Analyze</button>
      <button class="secondary" onclick="clearInput()">Clear</button>
      <span class="quota-text" id="quotaText"></span>
    </div>

    <div id="loading"><div class="spinner"></div><span>Analyzing sites...</span></div>
  </div>

  <div id="output"></div>
</div>

<button class="back-to-top" id="backToTop" onclick="goHome()">↑ Back to top</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <span class="close-btn" onclick="closeModal()">Close ✕</span>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let storedResults = {};
const HISTORY_KEY = "seo_analyzer_url_history";
const DAILY_LIMIT = 20;

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}

function saveToHistory(urls) {
  let history = getHistory();
  urls.forEach(u => {
    history = history.filter(h => h !== u);
    history.unshift(u);
  });
  history = history.slice(0, 10);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function clearHistory(e) {
  e.stopPropagation();
  localStorage.removeItem(HISTORY_KEY);
  document.getElementById("suggestions").style.display = "none";
}

function renderSuggestions() {
  const history = getHistory();
  const list = document.getElementById("suggestionsList");
  const box = document.getElementById("suggestions");
  if (history.length === 0) { box.style.display = "none"; return; }
  list.innerHTML = history.map(u => `<div class="sugg-item" onclick="addUrlFromHistory('${u.replace(/'/g,"\\'")}')">${u}</div>`).join("");
  box.style.display = "block";
}

function addUrlFromHistory(url) {
  const ta = document.getElementById("urls");
  let current = ta.value.split("\n").map(u => u.trim()).filter(Boolean);
  if (!current.includes(url)) current.push(url);
  ta.value = current.join("\n");
  document.getElementById("suggestions").style.display = "none";
  updateCount();
  ta.focus();
}

function updateCount() {
  const n = document.getElementById("urls").value.split("\n").map(u => u.trim()).filter(Boolean).length;
  document.getElementById("countBadge").innerText = `${n} / 5 URLs`;
}

document.getElementById("urls").addEventListener("input", updateCount);
document.getElementById("urls").addEventListener("focus", renderSuggestions);
document.addEventListener("click", (e) => {
  const box = document.getElementById("suggestions");
  const ta = document.getElementById("urls");
  if (!box.contains(e.target) && e.target !== ta) box.style.display = "none";
});

function clearInput() {
  document.getElementById("urls").value = "";
  document.getElementById("output").innerHTML = "";
  document.getElementById("warning").innerText = "";
  updateCount();
}

function goHome() {
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function reloadPage() {
  window.location.reload();
}

async function checkAnyway(url, btnEl) {
  const originalText = btnEl.innerText;
  btnEl.disabled = true;
  btnEl.innerText = "Checking...";
  btnEl.style.opacity = "0.6";
  btnEl.style.cursor = "not-allowed";

  try {
    const res = await fetch("/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ urls: [url], respect_robots: false })
    });
    const data = await res.json();

    if (res.status === 429) {
      showToast(data.detail);
      btnEl.disabled = false;
      btnEl.innerText = originalText;
      btnEl.style.opacity = "1";
      btnEl.style.cursor = "pointer";
      return;
    }

    const r = data.results[0];
    if (r.error) {
      showToast("Still couldn't fetch this site: " + r.error);
      btnEl.disabled = false;
      btnEl.innerText = originalText;
      btnEl.style.opacity = "1";
      btnEl.style.cursor = "pointer";
      return;
    }

    storedResults[r.url] = r;
    const quotaText = document.getElementById("quotaText");
    if (typeof data.remaining_today === "number") {
      quotaText.innerHTML = `<b>${data.remaining_today}</b> / ${DAILY_LIMIT} requests left today`;
    }

    const cards = document.querySelectorAll("#output .site-card");
    cards.forEach(card => {
      const heading = card.querySelector("h3");
      if (heading && heading.innerText === url) {
        card.outerHTML = siteCard(r);
      }
    });
  } catch (err) {
    showToast("Request failed: " + err);
    btnEl.disabled = false;
    btnEl.innerText = originalText;
    btnEl.style.opacity = "1";
    btnEl.style.cursor = "pointer";
  }
}

window.addEventListener("scroll", () => {
  const btn = document.getElementById("backToTop");
  if (window.scrollY > 400) {
    btn.style.display = "flex";
  } else {
    btn.style.display = "none";
  }
});

function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2000);
}

function closeModal() { document.getElementById("overlay").style.display = "none"; }
function openModal(title, bodyHtml) {
  document.getElementById("modalTitle").innerText = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  document.getElementById("overlay").style.display = "block";
}

function showImages(url) {
  const r = storedResults[url];
  let html = "<table>";
  r.images.forEach(img => {
    html += `<tr><td>${img.src || "-"}</td><td class="${img.alt ? '' : 'no-alt'}">${img.alt || "MISSING ALT"}</td></tr>`;
  });
  html += "</table>";
  openModal("Images — " + url, html);
}

function showLinks(url, type) {
  const r = storedResults[url];
  const links = type === "internal" ? r.internal_links : r.external_links;
  let html = "<table>";
  links.forEach(l => { html += `<tr><td>${l}</td></tr>`; });
  html += "</table>";
  openModal((type === "internal" ? "Internal Links — " : "External Links — ") + url, html);
}

function showHeadings(url) {
  const r = storedResults[url];
  let html = "<table>";
  html += `<tr><td class="tag-cell">H1</td><td>${r.h1 || "-"}</td></tr>`;
  r.h2.forEach(h => { html += `<tr><td class="tag-cell">H2</td><td>${h}</td></tr>`; });
  r.h3.forEach(h => { html += `<tr><td class="tag-cell">H3</td><td>${h}</td></tr>`; });
  html += "</table>";
  openModal("Headings — " + url, html);
}

function showSocialTags(url) {
  const r = storedResults[url];
  let html = `<p style="color:var(--text-dim);font-size:13px;margin-bottom:14px;">These tags control how this page's link looks when someone pastes or shares it on social apps — the preview title, description, and image.</p>`;
  html += "<table>";
  html += `<tr><td class="tag-cell" colspan="2" style="color:var(--accent);">Open Graph (Facebook, LinkedIn, WhatsApp)</td></tr>`;
  const og = r.social_tags.open_graph;
  if (Object.keys(og).length === 0) {
    html += `<tr><td colspan="2">No Open Graph tags found</td></tr>`;
  } else {
    Object.keys(og).forEach(k => { html += `<tr><td class="tag-cell">${k}</td><td>${og[k] || "-"}</td></tr>`; });
  }
  html += `<tr><td class="tag-cell" colspan="2" style="color:var(--accent);">Twitter Card (X)</td></tr>`;
  const tw = r.social_tags.twitter_card;
  if (Object.keys(tw).length === 0) {
    html += `<tr><td colspan="2">No Twitter Card tags found</td></tr>`;
  } else {
    Object.keys(tw).forEach(k => { html += `<tr><td class="tag-cell">${k}</td><td>${tw[k] || "-"}</td></tr>`; });
  }
  html += "</table>";
  openModal("Social Sharing Tags — " + url, html);
}

function showBrokenLinks(url) {
  const r = storedResults[url];
  const b = r.broken_links_check;
  let html = `<p style="color:var(--text-dim);font-size:13px;margin-bottom:12px;">Checked ${b.checked_count} internal links, found ${b.broken_count} broken.</p>`;
  if (b.broken_links.length === 0) {
    html += `<p class="badge ok">✓ No broken links found in checked sample</p>`;
  } else {
    html += "<table>";
    b.broken_links.forEach(bl => {
      html += `<tr><td>${bl.url}</td><td class="status-bad">${bl.status}</td></tr>`;
    });
    html += "</table>";
  }
  openModal("Broken Internal Links — " + url, html);
}

function downloadCSV(url) {
  const r = storedResults[url];
  let rows = [
    ["Field", "Value"],
    ["URL", r.url],
    ["Title", r.title || ""],
    ["Title Length", r.title_length + " (" + r.title_length_status + ")"],
    ["Meta Description Length", r.description_length + " (" + r.description_length_status + ")"],
    ["Word Count", r.word_count],
    ["Internal Links Count", r.internal_links_count],
    ["External Links Count", r.external_links_count],
    ["Broken Internal Links", r.broken_links_check.broken_count + " / " + r.broken_links_check.checked_count + " checked"],
    ["Images Count", r.images_count],
    ["Images Missing ALT", r.images_missing_alt],
    ["Canonical URL", r.canonical_url || "Missing"],
    ["Viewport Tag", r.viewport_present ? "Present" : "Missing"],
    ["Open Graph Tags", r.social_tags.open_graph_present ? "Present" : "Missing"],
    ["Twitter Card Tags", r.social_tags.twitter_card_present ? "Present" : "Missing"],
    ["Schemas", r.schemas.join(" | ")],
    ["AEO Score", r.aeo_readiness.score + " / " + r.aeo_readiness.max_score]
  ];
  let csv = rows.map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = url.replace(/https?:\/\//,"").replace(/\W+/g,"_") + "_seo_report.csv";
  link.click();
}

function copySummary(url) {
  const r = storedResults[url];
  const text = `SEO Summary — ${r.url}
Title: ${r.title || "-"} (${r.title_length} chars, ${r.title_length_status})
Meta Description: ${r.description_length} chars (${r.description_length_status})
Word Count: ${r.word_count}
Internal Links: ${r.internal_links_count} | External Links: ${r.external_links_count}
Broken Links: ${r.broken_links_check.broken_count} of ${r.broken_links_check.checked_count} checked
Images: ${r.images_count} (${r.images_missing_alt} missing ALT)
Canonical: ${r.canonical_url ? "Present" : "Missing"}
Viewport: ${r.viewport_present ? "Present" : "Missing"}
Schemas: ${r.schemas.join(", ") || "None"}
AEO Score: ${r.aeo_readiness.score} / ${r.aeo_readiness.max_score}`;
  navigator.clipboard.writeText(text).then(() => showToast("Summary copied to clipboard"));
}

function lengthBadge(status) {
  if (status === "Good") return `<span class="badge ok">✓ Good</span>`;
  if (status === "Missing") return `<span class="badge no">✗ Missing</span>`;
  return `<span class="badge mid">⚠ ${status}</span>`;
}

function siteCard(r) {
  const canonicalBadge = r.canonical_url ? `<span class="badge ok">✓ Present</span>` : `<span class="badge no">✗ Missing</span>`;
  const viewportBadge = r.viewport_present ? `<span class="badge ok">✓ Present</span>` : `<span class="badge no">✗ Missing</span>`;
  const scorePct = Math.round((r.aeo_readiness.score / r.aeo_readiness.max_score) * 100);
  const brokenBadge = r.broken_links_check.broken_count > 0
    ? `<span class="badge no">${r.broken_links_check.broken_count} broken</span>`
    : `<span class="badge ok">✓ None found</span>`;

  const checklistLabels = {
    question_format_headings: "Headings written as questions (e.g. \"What is...\", \"How to...\")",
    faq_schema_present: "FAQ schema markup found",
    concise_answer_blocks: "Answers are short & scannable, not long paragraphs",
    h1_present: "Page has one clear main heading (H1)",
    any_schema_present: "Structured data (schema) present on page"
  };
  let checklistHtml = "";
  for (const key in r.aeo_readiness.breakdown) {
    const pass = r.aeo_readiness.breakdown[key];
    checklistHtml += `<div class="item"><span style="color:${pass ? 'var(--good)' : 'var(--bad)'}">${pass ? '✓' : '✗'}</span><span>${checklistLabels[key] || key}</span></div>`;
  }

  return `
    <div class="site-card">
      <h3>${r.url}</h3>
      <div class="title-line">${r.title || "No title found"}</div>

      <div class="section-label">Content Overview</div>
      <div class="metric-grid">
        <div class="metric clickable" onclick="showHeadings('${r.url}')">
          <div class="label">Headings</div>
          <div class="value">H1 · ${r.h2.length} H2 · ${r.h3.length} H3</div>
        </div>
        <div class="metric"><div class="label">Word Count</div><div class="value">${r.word_count.toLocaleString()}</div></div>
        <div class="metric"><div class="label">Title Length</div><div class="value">${r.title_length} chars</div><div class="sub">${lengthBadge(r.title_length_status)}</div></div>
        <div class="metric"><div class="label">Meta Description</div><div class="value">${r.description_length} chars</div><div class="sub">${lengthBadge(r.description_length_status)}</div></div>
      </div>

      <div class="section-label">Links & Media</div>
      <div class="metric-grid">
        <div class="metric clickable" onclick="showLinks('${r.url}','internal')"><div class="label">Internal Links</div><div class="value">${r.internal_links_count}</div></div>
        <div class="metric clickable" onclick="showLinks('${r.url}','external')"><div class="label">External Links</div><div class="value">${r.external_links_count}</div></div>
        <div class="metric clickable" onclick="showBrokenLinks('${r.url}')"><div class="label">Broken Links</div><div class="value">${brokenBadge}</div><div class="sub">of ${r.broken_links_check.checked_count} checked</div></div>
        <div class="metric clickable" onclick="showImages('${r.url}')"><div class="label">Images</div><div class="value">${r.images_count}</div><div class="sub">${r.images_missing_alt} missing ALT</div></div>
      </div>

      <div class="section-label">Technical & Social</div>
      <div class="metric-grid">
        <div class="metric">
          <div class="label">Canonical Tag</div>
          <div class="value">${canonicalBadge}</div>
          <div class="sub">Tells Google which URL is the "original" — prevents duplicate content issues</div>
        </div>
        <div class="metric">
          <div class="label">Mobile Viewport</div>
          <div class="value">${viewportBadge}</div>
          <div class="sub">Makes the page render correctly on phones</div>
        </div>
        <div class="metric clickable" onclick="showSocialTags('${r.url}')">
          <div class="label">Social Sharing Tags</div>
          <div class="value">${r.social_tags.open_graph_present || r.social_tags.twitter_card_present ? "View" : "None found"}</div>
          <div class="sub">Controls the preview card shown when this link is shared on Facebook, WhatsApp & X</div>
        </div>
        <div class="metric">
          <div class="label">Structured Data (Schema)</div>
          <div class="value" style="font-size:13px;">${r.schemas.length ? r.schemas.length + " types" : "None"}</div>
          <div class="sub">Extra code that helps Google understand and richly display this page</div>
        </div>
      </div>
      ${r.schemas.length ? `<div class="section-label" style="margin-top:14px;">Schemas Found</div><div>${r.schemas.map(s => `<span class="tag">${s}</span>`).join("")}</div>` : ""}

      <div class="section-label">AEO Readiness</div>
      <p style="color:var(--text-dim); font-size:12px; margin-bottom:10px;">How well this page is set up to be picked as a direct answer by AI tools like Google AI Overviews, ChatGPT & Siri.</p>
      <div class="score-bar-wrap">
        <div class="row" style="display:flex;justify-content:space-between;font-size:14px;font-weight:600;">
          <span>Score</span><span>${r.aeo_readiness.score} / ${r.aeo_readiness.max_score}</span>
        </div>
        <div class="score-bar-track"><div class="score-bar-fill" style="width:${scorePct}%;"></div></div>
        <div class="score-checklist">${checklistHtml}</div>
      </div>

      <div class="card-actions">
        <button class="download-btn" onclick='downloadCSV(${JSON.stringify(r.url)})'>⬇ Download Report (CSV)</button>
        <button class="copy-btn" onclick='copySummary(${JSON.stringify(r.url)})'>📋 Copy Summary</button>
      </div>
    </div>`;
}

async function runAnalysis() {
  const raw = document.getElementById("urls").value;
  const urls = raw.split("\n").map(u => u.trim()).filter(Boolean);
  const output = document.getElementById("output");
  const loading = document.getElementById("loading");
  const warning = document.getElementById("warning");
  const btn = document.querySelector("button.primary");
  const quotaText = document.getElementById("quotaText");

  warning.innerText = "";
  output.innerHTML = "";
  document.getElementById("suggestions").style.display = "none";

  if (urls.length === 0) { warning.innerText = "Enter at least 1 URL"; return; }
  if (urls.length > 5) { warning.innerText = "Max 5 URLs allowed"; return; }

  loading.style.display = "flex";
  btn.disabled = true;
  quotaText.innerText = "";

  try {
    const res = await fetch("/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ urls, respect_robots: true })
    });
    const data = await res.json();

    loading.style.display = "none";
    btn.disabled = false;

    if (res.status === 429) {
      output.innerHTML = `<div class="site-card error-card"><h3>Limit reached</h3><div class="error-text">${data.detail}</div></div>`;
      quotaText.innerHTML = `<b>0</b> / ${DAILY_LIMIT} requests left today`;
      return;
    }

    saveToHistory(urls);

    if (typeof data.remaining_today === "number") {
      quotaText.innerHTML = `<b>${data.remaining_today}</b> / ${DAILY_LIMIT} requests left today`;
    }

    storedResults = {};
    let blockedUrls = [];
    data.results.forEach(r => {
      if (r.error) {
        const isRobotsBlock = r.error.toLowerCase().includes("robots.txt");
        if (isRobotsBlock) blockedUrls.push(r.url);
        output.innerHTML += `
          <div class="site-card error-card">
            <h3>${r.url || "URL"}</h3>
            <div class="error-text">${isRobotsBlock ? "This site's robots.txt blocks automated tools." : r.error}</div>
            ${isRobotsBlock ? `<button class="secondary" id="checkAnywayBtn-${blockedUrls.length}" style="margin-top:10px;" onclick="checkAnyway('${r.url}', this)">Check anyway →</button>` : ""}
          </div>`;
        return;
      }
      storedResults[r.url] = r;
      output.innerHTML += siteCard(r);
    });

    if (data.comparison) {
      const c = data.comparison;
      output.innerHTML += `
        <div class="site-card compare-card">
          <h3>Comparison Summary</h3>
          <div class="metric-grid" style="margin-top:14px;">
            <div class="metric"><div class="label">Average Word Count</div><div class="value">${c.average_word_count.toLocaleString()}</div></div>
            <div class="metric"><div class="label">Sites Missing Canonical</div><div class="value" style="font-size:14px;">${c.sites_missing_canonical.length ? c.sites_missing_canonical.join(", ") : "None"}</div></div>
          </div>
        </div>`;
    }
  } catch (err) {
    loading.style.display = "none";
    btn.disabled = false;
    output.innerHTML = `<div class="site-card error-card"><div class="error-text">Request failed: ${err}</div></div>`;
  }
}
</script>
</body>
</html>
